[package]
name = "mouthy"
version = "0.4.0"
description = "Mouthy"
authors = ["Azizi Adeyemo", "cjpais"]
edition = "2021"
license = "MIT"
repository = "https://github.com/azizi-a/mouthy"
default-run = "mouthy"

[profile.dev]
incremental = true # Compile your binary in smaller steps.

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mouthy_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dependencies]
once_cell = "1"
tauri = { version = "2.11.5", features = [
  "macos-private-api",
  "tray-icon",
  'image-png',
] }
tauri-plugin-log = "2.7.1"
tauri-plugin-opener = "2.5.2"
tauri-plugin-store = "2.4.1"
tauri-plugin-os = "2.3.2"
tauri-plugin-macos-permissions = "2.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4.25"
env_filter = "0.1.0"
enigo = "0.6.1"
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
reqwest = { version = "0.12", features = ["json"] }
handy-keys = "0.3.4"
clap = { version = "4", features = ["derive"] }
specta = "=2.0.0-rc.22"
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
# In-process Kokoro. Every ort rc has broken the API, so it is pinned exactly;
# ONNX Runtime is linked statically from pyke's prebuilt archive (no coreml: slower for Kokoro).
ort = { version = "=2.0.0-rc.14", default-features = false, features = [
  "std",
  "download-binaries",
  "tls-native",
  "api-31",
] }
# English G2P with embedded lexicons; no espeak-ng, which is GPL.
misaki-rs = { version = "0.6", default-features = false }
# Model downloads: checksums, and cancelling a download mid-transfer.
sha2 = "0.10"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-single-instance = "2.3.2"

[target.'cfg(windows)'.dependencies]
# Used to reach ICoreWebView2Settings3 through the webview's controller
# (disabling browser accelerator keys in the main window). Must match the
# version wry links against so the COM types are identical.
webview2-com = "0.38"
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
# Pasteboard snapshot/restore around selection capture, and the login item.
# Versions track what Tauri already pulls in.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-service-management = "0.3.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
gtk = "0.18"

# TEMPORARY: tao pinned past 0.35.3 for the Wayland client-side-decorations fix
# (tao #1218, fixes tauri #11856 — dead titlebar buttons after visible(false) →
# show()). Drop this once a tao release containing it lands in tauri.
#
# The rev is a cjpais/tao branch, not upstream: dev past 0.35.3 also carries
# tao #1231 (removed window subclassing), which left the thread event target's
# WNDPROC falling through to DefSubclassProc. On a no-longer-subclassed window
# that returns 0, so WM_QUERYENDSESSION answered FALSE and vetoed Windows
# shutdown (Handy #1710). `handy` = 07f3742b + a cherry-pick of tao #1274
# (DefSubclassProc → DefWindowProcW). Repoint at upstream once #1274 merges.
#
# tao-macros must be patched to the SAME rev even though nothing here depends on
# it directly: wry pulls tao-macros 0.1.3 from crates.io, so without this the
# lockfile carries two tao-macros 0.1.3 entries (registry + git). cargo tolerates
# that, but Nix's importCargoLock vendors both to the same `tao-macros-0.1.3`
# dir and fails with a symlink collision. Unifying the source removes the dup.
[patch.crates-io]
tao = { git = "https://github.com/cjpais/tao", rev = "c3bee28c1d446d95f08c95c3b6f8d4bde052b876" }
tao-macros = { git = "https://github.com/cjpais/tao", rev = "c3bee28c1d446d95f08c95c3b6f8d4bde052b876" }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
