name: Linux

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to bundle
        default: main

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    # pyke's prebuilt ONNX Runtime needs glibc 2.38 and GCC 13's libstdc++.
    runs-on: ubuntu-24.04
    concurrency:
      group: linux-check-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - &checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - &apt
        name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libasound2-dev libgtk-layer-shell-dev libx11-dev \
            libxtst-dev libxrandr-dev libssl-dev pkg-config
      # The Mac's toolchain; bump by hand.
      - &rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - &bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - &frontend
        name: Build frontend
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Test
        working-directory: src-tauri
        run: cargo test
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  bundle:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - *checkout
      - *apt
      # No cargo cache: a cache saved by another ref must not reach release binaries.
      - *rust
      - *bun
      - *frontend
      - name: Bundle deb, rpm and AppImage
        run: bun run tauri build --bundles deb,rpm,appimage
      - name: Collect bundles
        working-directory: src-tauri/target/release/bundle
        run: |
          out="$RUNNER_TEMP/linux"
          mkdir -p "$out"
          cp deb/*.deb rpm/*.rpm appimage/*.AppImage "$out"/
          cd "$out"
          sha256sum -- *.deb *.rpm *.AppImage > SHA256SUMS-linux
          cat SHA256SUMS-linux
          ls -l
      - name: Show package dependencies
        working-directory: ${{ runner.temp }}/linux
        run: |
          echo "::group::Highest glibc symbol the binary needs"
          objdump -T "$GITHUB_WORKSPACE/src-tauri/target/release/mouthy" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
          echo "::endgroup::"
          sudo apt-get install -y rpm
          echo "::group::rpm -qpR"
          rpm -qpR ./*.rpm
          echo "::endgroup::"
          echo "::group::dpkg -I"
          dpkg -I ./*.deb
          echo "::endgroup::"
          appimage="$(realpath ./*.AppImage)"
          extract="$RUNNER_TEMP/appimage"
          mkdir -p "$extract"
          chmod +x "$appimage"
          (cd "$extract" && "$appimage" --appimage-extract > /dev/null)
          echo "::group::AppImage usr/lib"
          ls -1 "$extract/squashfs-root/usr/lib"
          echo "::endgroup::"
          echo "::group::AppImage .desktop"
          cat "$extract"/squashfs-root/*.desktop
          echo "::endgroup::"
      - uses: actions/upload-artifact@v7
        with:
          name: mouthy-linux
          path: ${{ runner.temp }}/linux/*
          if-no-files-found: error
          overwrite: true

  attach:
    needs: bundle
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download the bundles
        run: gh run download "$GITHUB_RUN_ID" -n mouthy-linux -D "$RUNNER_TEMP/linux"
      - name: Attach to the draft release
        working-directory: ${{ runner.temp }}/linux
        # The tag can be pushed before the draft exists; a published release is never changed.
        run: |
          for _ in $(seq 30); do
            if draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2> view.err)"; then
              if [ "$draft" != "true" ]; then
                echo "::error::Release $TAG is already published; nothing was uploaded."
                exit 1
              fi
              gh release upload "$TAG" --clobber -- *.deb *.rpm *.AppImage SHA256SUMS-linux
              exit 0
            fi
            if ! grep -q "not found" view.err; then
              cat view.err
              echo "::error::Could not read release $TAG."
              exit 1
            fi
            sleep 60
          done
          echo "::error::No release for $TAG after 30 minutes; create the draft, then re-run this job."
          exit 1
