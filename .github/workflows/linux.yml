name: Linux

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to bundle
        default: main

permissions:
  contents: read

env:
  # The Mac's toolchain; bump by hand.
  RUST_TOOLCHAIN: 1.99.1
  BUN_VERSION: 1.4.4

jobs:
  check:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    # pyke's prebuilt ONNX Runtime needs glibc 2.38 and GCC 13's libstdc++.
    runs-on: ubuntu-24.04
    concurrency:
      group: linux-check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - &checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - &apt
        name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libasound2-dev libgtk-layer-shell-dev libx11-dev \
            libxtst-dev libxrandr-dev libssl-dev pkg-config
      - &rust
        name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup default "$RUST_TOOLCHAIN"
      - &bun
        name: Install bun
        run: |
          export BUN_INSTALL="$HOME/.bun"
          curl -fsSL https://bun.sh/install | bash -s "bun-v$BUN_VERSION"
          echo "$BUN_INSTALL/bin" >> "$GITHUB_PATH"
      - &frontend
        name: Build frontend
        run: |
          bun install --frozen-lockfile
          bun run build
      # No cargo cache: actions/cache is not on this repo's Actions allowlist.
      - name: Test
        working-directory: src-tauri
        run: cargo test
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  bundle:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - *checkout
      - *apt
      - *rust
      - *bun
      - *frontend
      - name: Bundle deb, rpm and AppImage
        run: bun run tauri build --bundles deb,rpm,appimage
      - name: Collect bundles
        working-directory: src-tauri/target/release/bundle
        run: |
          out="$RUNNER_TEMP/linux"
          mkdir -p "$out"
          cp deb/*.deb rpm/*.rpm appimage/*.AppImage "$out"/
          cd "$out"
          sha256sum -- *.deb *.rpm *.AppImage > SHA256SUMS-linux
          cat SHA256SUMS-linux
          ls -l
      - name: Show package dependencies
        working-directory: ${{ runner.temp }}/linux
        run: |
          sudo apt-get install -y rpm
          echo "::group::rpm -qpR"
          rpm -qpR ./*.rpm
          echo "::endgroup::"
          echo "::group::dpkg -I"
          dpkg -I ./*.deb
          echo "::endgroup::"
          appimage="$(realpath ./*.AppImage)"
          extract="$RUNNER_TEMP/appimage"
          mkdir -p "$extract"
          chmod +x "$appimage"
          (cd "$extract" && "$appimage" --appimage-extract > /dev/null)
          echo "::group::AppImage usr/lib"
          ls -1 "$extract/squashfs-root/usr/lib"
          echo "::endgroup::"
          echo "::group::AppImage .desktop"
          cat "$extract"/squashfs-root/*.desktop
          echo "::endgroup::"
      - uses: actions/upload-artifact@v7
        with:
          name: mouthy-linux
          path: ${{ runner.temp }}/linux/*
          if-no-files-found: error
      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: ${{ runner.temp }}/linux
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        # The tag can be pushed before the draft release exists.
        run: |
          for _ in $(seq 30); do
            if gh release view "$TAG" > /dev/null 2>&1; then
              gh release upload "$TAG" --clobber -- *.deb *.rpm *.AppImage SHA256SUMS-linux
              exit 0
            fi
            sleep 60
          done
          echo "::error::No release for $TAG after 30 minutes; create the draft, then re-run this job."
          exit 1
