name: Bug report
description: Something in Mouthy does not work as expected
labels: [bug]
body:
  - type: input
    id: os
    attributes:
      label: macOS version, or Linux distribution and version
      placeholder: "15.1, or Bazzite 42"
    validations:
      required: true
  - type: dropdown
    id: desktop
    attributes:
      label: Linux desktop
      description: Linux only.
      options:
        - KDE Plasma
        - GNOME
        - Other (say which in the steps)
  - type: dropdown
    id: package
    attributes:
      label: Linux package
      description: Linux only.
      options:
        - AppImage
        - rpm
        - deb
        - Built from source
  - type: dropdown
    id: linux-shortcut
    attributes:
      label: Linux shortcuts
      description: Linux only.
      options:
        - Desktop shortcut running a mouthy command
        - Event Tap (Settings → Advanced)
  - type: input
    id: version
    attributes:
      label: Mouthy version
      description: Shown on Settings → About.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Speech Engine
      description: Settings → General.
      options:
        - Local (offline)
        - HTTP server
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Select text in …
        2. Press ⌥⎋
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: From `mouthy.log` in the log folder (Settings → About). Remove anything private.
      render: text
